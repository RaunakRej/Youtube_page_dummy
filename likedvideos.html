<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liked Videos</title>

    <link rel="stylesheet" href="youtube_style.css">

    <link rel="icon" type="image/png"
        href="https://www.freepnglogos.com/uploads/youtube-logo-png/youtube-transparent-youtube-icon-download-clipart-with-transparent-25.png">

    <style>

        /* =====================================================
           BODY
        ===================================================== */

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #fff;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .liked-container {
            display: flex;
            padding: 25px;
            gap: 35px;
        }


        /* =====================================================
           LEFT PLAYLIST CARD
        ===================================================== */

        .playlist-card {
            width: 350px;

            background:
                linear-gradient(
                    #8b5d3d,
                    #5b3822
                );

            border-radius: 18px;

            padding: 25px;

            color: white;

            position: sticky;

            top: 90px;

            height: 730px;

            box-sizing: border-box;
        }


        .playlist-card img {
            width: 100%;

            border-radius: 15px;

            display: block;
        }


        .playlist-card h1 {
            margin-top: 20px;

            font-size: 42px;
        }


        .playlist-card h3 {
            font-size: 22px;

            margin-bottom: 10px;
        }


        .playlist-card p {
            font-size: 17px;
        }


        /* =====================================================
           PLAY BUTTONS
        ===================================================== */

        .play-buttons {
            display: flex;

            gap: 15px;

            margin-top: 25px;
        }


        .play-buttons button {
            padding: 15px 30px;

            border: none;

            border-radius: 35px;

            cursor: pointer;

            font-size: 18px;

            font-weight: bold;

            transition: transform 0.2s ease;
        }


        .play {
            background: white;

            color: black;
        }


        .shuffle {
            background: #6c4b34;

            color: white;
        }


        .play-buttons button:hover {
            transform: scale(1.03);
        }


        /* =====================================================
           RIGHT AREA
        ===================================================== */

        .right-area {
            flex: 1;

            min-width: 0;
        }


        /* =====================================================
           FILTER BUTTONS
        ===================================================== */

        .filter {
            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }


        .filter button {
            padding: 10px 18px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            background: #f2f2f2;

            font-size: 15px;

            transition: background 0.2s ease;
        }


        .filter button:hover {
            background: #ddd;
        }


        .filter .active {
            background: black;

            color: white;
        }


        /* =====================================================
           VIDEO ITEM
        ===================================================== */

        .video-item {
            display: flex;

            margin-bottom: 22px;

            cursor: pointer;

            position: relative;

            width: 100%;

            min-height: 140px;

            padding: 8px;

            border-radius: 10px;

            box-sizing: border-box;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .video-item:hover {
            background: #f2f2f2;

            transform: scale(1.01);
        }


        /* =====================================================
           VIDEO THUMBNAIL
        ===================================================== */

        .video-item > img {
            width: 250px !important;

            height: 140px !important;

            min-width: 250px;

            max-width: 250px;

            border-radius: 12px;

            object-fit: cover;

            display: block;
        }


        /* =====================================================
           VIDEO DURATION
        ===================================================== */

        .video-item > .dur {
            position: absolute;

            left: 198px;

            bottom: 12px;

            width: auto !important;

            max-width: max-content !important;

            min-width: 0 !important;

            display: inline-block;

            background: rgba(0, 0, 0, 0.85);

            color: #fff;

            padding: 3px 6px;

            border-radius: 4px;

            font-size: 13px;

            font-weight: bold;

            line-height: 1.2;

            white-space: nowrap;

            box-sizing: border-box;

            z-index: 10;
        }


        /* =====================================================
           VIDEO INFORMATION
        ===================================================== */

        .video-info {
            margin-left: 15px;

            padding-top: 0;
        }


        .video-info h3 {
            margin: 0;

            font-size: 22px;

            line-height: 1.3;
        }


        .video-info p {
            margin: 8px 0;

            color: gray;

            font-size: 15px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {
            padding: 50px;

            text-align: center;

            color: #666;

            font-size: 18px;
        }


        /* =====================================================
           NO RESULTS / ERROR
        ===================================================== */

        .no-results {
            padding: 60px 20px;

            text-align: center;

            color: #666;
        }


        .no-results h2 {
            margin-bottom: 10px;

            color: #222;
        }


        .no-results p {
            color: #777;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .liked-container {
                flex-direction: column;
            }


            .playlist-card {
                width: 100%;

                position: relative;

                top: 0;

                height: auto;
            }


            .playlist-card img {
                max-width: 400px;
            }

        }


        @media (max-width: 650px) {

            .liked-container {
                padding: 15px;
            }


            .video-item {
                flex-direction: column;
            }


            .video-item > img {
                width: 100% !important;

                max-width: 100%;

                min-width: 0;

                height: auto !important;

                aspect-ratio: 16 / 9;
            }


            .video-item > .dur {
                left: auto;

                right: 8px;

                bottom: auto;

                top: 115px;
            }


            .video-info {
                margin-left: 0;

                padding-top: 10px;
            }


            .video-info h3 {
                font-size: 18px;
            }


            .play-buttons {
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN LIKED VIDEOS CONTAINER
    ===================================================== -->

    <div class="liked-container">


        <!-- =================================================
             LEFT PLAYLIST CARD
        ================================================== -->

        <div class="playlist-card">

            <img
                src="images/liked-banner.jpg"
                alt="Liked Videos"
            >


            <h1>
                Liked Videos
            </h1>


            <h3>
                Raunak Rej
            </h3>


            <!--
                Count is updated from localStorage.
                Key: likedVideoIds
            -->

            <p id="likedVideoCount">
                0 Videos
            </p>


            <div class="play-buttons">

                <button
                    class="play"
                    id="playAllBtn"
                    type="button"
                >
                    ▶ Play All
                </button>


                <button
                    class="shuffle"
                    id="shuffleBtn"
                    type="button"
                >
                    🔀 Shuffle
                </button>

            </div>

        </div>


        <!-- =================================================
             RIGHT AREA
        ================================================== -->

        <div class="right-area">


            <!-- =================================================
                 FILTER BUTTONS
            ================================================== -->

            <div class="filter">

                <button
                    class="active"
                    id="allBtn"
                    type="button"
                >
                    All
                </button>


                <button
                    id="videosBtn"
                    type="button"
                >
                    Videos
                </button>


                <button
                    id="shortsBtn"
                    type="button"
                >
                    Shorts
                </button>

            </div>


            <!-- =================================================
                 LIKED VIDEOS CONTAINER

                 Data comes from:
                 GET /api/videos/liked
            ================================================== -->

            <div id="likedVideosContainer">

                <div class="loading">
                    Loading liked videos...
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        // =====================================================
        // API URL
        // =====================================================

        const LIKED_VIDEOS_API =
            "http://localhost:8080/api/videos/liked";


        // =====================================================
        // LOCAL STORAGE KEY
        // =====================================================

        const LIKED_VIDEOS_KEY =
            "likedVideoIds";


        // =====================================================
        // GLOBAL LIKED VIDEOS ARRAY
        // =====================================================

        let likedVideos = [];


        // =====================================================
        // DOM ELEMENTS
        // =====================================================

        const likedVideosContainer =
            document.getElementById(
                "likedVideosContainer"
            );


        const likedVideoCount =
            document.getElementById(
                "likedVideoCount"
            );


        const allBtn =
            document.getElementById(
                "allBtn"
            );


        const videosBtn =
            document.getElementById(
                "videosBtn"
            );


        const shortsBtn =
            document.getElementById(
                "shortsBtn"
            );


        const playAllBtn =
            document.getElementById(
                "playAllBtn"
            );


        const shuffleBtn =
            document.getElementById(
                "shuffleBtn"
            );


        // =====================================================
        // GET LIKED VIDEO IDS FROM LOCAL STORAGE
        // =====================================================

        function getLikedVideoIds() {

            try {

                const storedIds =
                    localStorage.getItem(
                        LIKED_VIDEOS_KEY
                    );


                if (!storedIds) {
                    return [];
                }


                const parsedIds =
                    JSON.parse(storedIds);


                return Array.isArray(parsedIds)
                    ? parsedIds
                    : [];

            }

            catch (error) {

                console.error(
                    "Error reading liked video IDs:",
                    error
                );

                return [];
            }
        }


        // =====================================================
        // UPDATE LIKED VIDEO COUNT
        // =====================================================

        function updateLikedVideoCount() {

            if (!likedVideoCount) {
                return;
            }


            const likedVideoIds =
                getLikedVideoIds();


            const count =
                likedVideoIds.length;


            likedVideoCount.textContent =
                count === 1
                    ? "1 Video"
                    : count + " Videos";
        }


        // =====================================================
        // LOAD LIKED VIDEOS FROM SPRING BOOT API
        // =====================================================

        async function loadLikedVideos() {

            try {

                console.log(
                    "Fetching liked videos..."
                );


                // Show loading

                likedVideosContainer.innerHTML = `
                    <div class="loading">
                        Loading liked videos...
                    </div>
                `;


                // =================================================
                // UPDATE COUNT FIRST
                // =================================================

                updateLikedVideoCount();


                // =================================================
                // CALL SPRING BOOT API
                // =================================================

                const response =
                    await fetch(
                        LIKED_VIDEOS_API
                    );


                // =================================================
                // CHECK RESPONSE
                // =================================================

                if (!response.ok) {

                    throw new Error(
                        "Liked videos API failed. Status: "
                        + response.status
                    );
                }


                // =================================================
                // CONVERT RESPONSE TO JSON
                // =================================================

                const data =
                    await response.json();


                // Make sure API response is an array

                likedVideos =
                    Array.isArray(data)
                        ? data
                        : [];


                console.log(
                    "Liked videos received:",
                    likedVideos
                );


                // =================================================
                // UPDATE COUNT AGAIN
                // =================================================

                updateLikedVideoCount();


                // =================================================
                // DISPLAY LIKED VIDEOS
                // =================================================

                renderLikedVideos(
                    likedVideos
                );

            }

            catch (error) {

                console.error(
                    "Error loading liked videos:",
                    error
                );


                likedVideosContainer.innerHTML = `

                    <div class="no-results">

                        <h2>
                            Unable to load liked videos
                        </h2>

                        <p>
                            Please make sure your Spring Boot
                            backend is running on port 8080.
                        </p>

                        <p>
                            API:
                            /api/videos/liked
                        </p>

                    </div>

                `;
            }
        }


        // =====================================================
        // RENDER LIKED VIDEOS
        // =====================================================

        function renderLikedVideos(videoList) {

            likedVideosContainer.innerHTML = "";


            // =================================================
            // NO VIDEOS
            // =================================================

            if (
                !Array.isArray(videoList) ||
                videoList.length === 0
            ) {

                likedVideosContainer.innerHTML = `

                    <div class="no-results">

                        <h2>
                            No liked videos
                        </h2>

                        <p>
                            Videos that you like will appear here.
                        </p>

                    </div>

                `;

                return;
            }


            // =================================================
            // CREATE VIDEO ITEMS
            // =================================================

            videoList.forEach(
                function (video) {

                    const videoItem =
                        document.createElement(
                            "div"
                        );


                    videoItem.className =
                        "video-item";


                    // Store category

                    videoItem.dataset.category =
                        video.category || "videos";


                    // =================================================
                    // VIDEO HTML
                    // =================================================

                    videoItem.innerHTML = `

                        <img
                            src="${video.thumbnail || ""}"
                            alt="${video.title || "Video"}"
                            loading="lazy"
                        >

                        <span class="dur">
                            ${video.duration || ""}
                        </span>

                        <div class="video-info">

                            <h3>
                                ${video.title || "Untitled Video"}
                            </h3>

                            <p>
                                ${video.channel || "Unknown Channel"}
                            </p>

                            <p>
                                ${video.views || "0 views"}
                                •
                                ${video.uploaded || ""}
                            </p>

                        </div>

                    `;


                    // =================================================
                    // OPEN VIDEO
                    // =================================================

                    videoItem.addEventListener(
                        "click",
                        function () {

                            console.log(
                                "Opening video:",
                                video.id
                            );


                            window.open(
                                "video.html?id="
                                + encodeURIComponent(
                                    video.id
                                ),
                                "_blank"
                            );

                        }
                    );


                    // Add video to container

                    likedVideosContainer.appendChild(
                        videoItem
                    );

                }
            );
        }


        // =====================================================
        // SET ACTIVE FILTER BUTTON
        // =====================================================

        function setActiveButton(activeButton) {

            allBtn.classList.remove(
                "active"
            );


            videosBtn.classList.remove(
                "active"
            );


            shortsBtn.classList.remove(
                "active"
            );


            activeButton.classList.add(
                "active"
            );
        }


        // =====================================================
        // FILTER LIKED VIDEOS
        // =====================================================

        function filterLikedVideos(filter) {

            let filteredVideos = [];


            // =================================================
            // ALL
            // =================================================

            if (filter === "all") {

                filteredVideos =
                    likedVideos;
            }


            // =================================================
            // VIDEOS
            // =================================================

            else if (filter === "videos") {

                filteredVideos =
                    likedVideos.filter(
                        function (video) {

                            return (
                                video.category !== "shorts"
                            );

                        }
                    );
            }


            // =================================================
            // SHORTS
            // =================================================

            else if (filter === "shorts") {

                filteredVideos =
                    likedVideos.filter(
                        function (video) {

                            return (
                                video.category === "shorts"
                            );

                        }
                    );
            }


            // =================================================
            // RENDER FILTERED RESULTS
            // =================================================

            renderLikedVideos(
                filteredVideos
            );
        }


        // =====================================================
        // ALL BUTTON
        // =====================================================

        if (allBtn) {

            allBtn.addEventListener(
                "click",
                function () {

                    setActiveButton(
                        allBtn
                    );


                    filterLikedVideos(
                        "all"
                    );

                }
            );
        }


        // =====================================================
        // VIDEOS BUTTON
        // =====================================================

        if (videosBtn) {

            videosBtn.addEventListener(
                "click",
                function () {

                    setActiveButton(
                        videosBtn
                    );


                    filterLikedVideos(
                        "videos"
                    );

                }
            );
        }


        // =====================================================
        // SHORTS BUTTON
        // =====================================================

        if (shortsBtn) {

            shortsBtn.addEventListener(
                "click",
                function () {

                    setActiveButton(
                        shortsBtn
                    );


                    filterLikedVideos(
                        "shorts"
                    );

                }
            );
        }


        // =====================================================
        // PLAY ALL
        // =====================================================

        if (playAllBtn) {

            playAllBtn.addEventListener(
                "click",
                function () {


                    if (
                        likedVideos.length === 0
                    ) {

                        alert(
                            "There are no liked videos to play."
                        );

                        return;
                    }


                    // Open first liked video

                    const firstVideo =
                        likedVideos[0];


                    window.open(
                        "video.html?id="
                        + encodeURIComponent(
                            firstVideo.id
                        ),
                        "_blank"
                    );

                }
            );
        }


        // =====================================================
        // SHUFFLE
        // =====================================================

        if (shuffleBtn) {

            shuffleBtn.addEventListener(
                "click",
                function () {


                    if (
                        likedVideos.length === 0
                    ) {

                        alert(
                            "There are no liked videos to shuffle."
                        );

                        return;
                    }


                    // Generate random index

                    const randomIndex =
                        Math.floor(
                            Math.random()
                            * likedVideos.length
                        );


                    const randomVideo =
                        likedVideos[randomIndex];


                    console.log(
                        "Opening random liked video:",
                        randomVideo.id
                    );


                    window.open(
                        "video.html?id="
                        + encodeURIComponent(
                            randomVideo.id
                        ),
                        "_blank"
                    );

                }
            );
        }


        // =====================================================
        // UPDATE PAGE WHEN USER RETURNS TO THIS TAB
        // =====================================================

        window.addEventListener(
            "pageshow",
            function () {

                console.log(
                    "Liked Videos page shown."
                );


                /*
                 * Read the latest localStorage value.
                 * This ensures the count is updated if the
                 * user liked/unliked a video on video.html
                 * and then returned here.
                 */

                updateLikedVideoCount();

            }
        );


        // =====================================================
        // INITIALIZE PAGE
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                console.log(
                    "Liked Videos page loaded."
                );


                // Update count immediately

                updateLikedVideoCount();


                // Load videos from backend

                loadLikedVideos();

            }
        );


    </script>

</body>

</html>
