<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Liked Videos</title>

    <link rel="stylesheet" href="youtube_style.css">
    <link rel="icon" type="image/png"
        href="https://www.freepnglogos.com/uploads/youtube-logo-png/youtube-transparent-youtube-icon-download-clipart-with-transparent-25.png">

    <style>
        body {

            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #fff;

        }

        .liked-container {

            display: flex;
            padding: 25px;
            gap: 35px;

        }

        /* LEFT CARD */

        .playlist-card {

            width: 350px;
            background: linear-gradient(#8b5d3d, #5b3822);

            border-radius: 18px;
            padding: 25px;
            color: white;
            position: sticky;
            top: 90px;
            height: 730px;

        }

        .playlist-card img {

            width: 100%;
            border-radius: 15px;

        }

        .playlist-card h1 {

            margin-top: 20px;
            font-size: 42px;

        }

        .playlist-card h3 {

            font-size: 22px;
            margin-bottom: 10px;

        }

        .play-buttons {

            display: flex;
            gap: 15px;
            margin-top: 25px;

        }

        .play-buttons button {

            padding: 15px 30px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;

        }

        .play {

            background: white;

        }

        .shuffle {

            background: #6c4b34;
            color: white;

        }

        /* RIGHT */

        .right-area {

            flex: 1;

        }

        .filter {

            display: flex;
            gap: 10px;
            margin-bottom: 25px;

        }

        .filter button {

            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;

        }

        .filter .active {

            background: black;
            color: white;

        }

        .video-item {

            display: flex;
            margin-bottom: 22px;
            cursor: pointer;

        }

        .video-item:hover {

            background: #f2f2f2;

        }

        .video-item img {

            width: 250px;
            height: 140px;
            border-radius: 12px;
            object-fit: cover;

        }

        .video-info {

            margin-left: 15px;

        }

        .video-info h3 {

            margin: 0;
            font-size: 22px;

        }

        .video-info p {

            margin: 8px 0;
            color: gray;

        }
    </style>

</head>

<body>

    <div class="liked-container">

        <div class="playlist-card">

            <img src="images/liked-banner.jpg">

            <h1>Liked Videos</h1>

            <h3>Raunak Rej</h3>

            <p>145 Videos</p>

            <div class="play-buttons">

                <button class="play">
                    ▶ Play All
                </button>

                <button class="shuffle">
                    🔀 Shuffle
                </button>

            </div>

        </div>

        <div class="right-area">

            <div class="filter">

                <button class="active">All</button>

                <button>Videos</button>

                <button>Shorts</button>

            </div>

            <div class="video-item" onclick="window.open('video.html?id=1','_blank')">

                <img
                    src="https://alchetron.com/cdn/footpath-2003-film-e6fce519-6290-411a-9f13-a3123a85251-resize-750.jpg">

                <div class="video-info">

                    <h3> Footpath - 2003</h3>

                    <p>Emraan Hashmi</p>

                    <p>102M views • 1 year ago</p>

                </div>

            </div>

            <div class="video-item" onclick="window.open('video.html?id=2','_blank')">

                <img
                    src="https://th.bing.com/th/id/OIP.bSmn7xv6XPtoRqSlNHi0DwHaEK?w=243&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3">

                <div class="video-info">

                    <h3>HAQ Trailer</h3>

                    <p>Pen Movies</p>

                    <p>10M views • 7 months ago</p>

                </div>

            </div>

            <div class="video-item" onclick="window.open('video.html?id=3','_blank')">

                <img src="https://tse1.mm.bing.net/th?&id=OVP.r51zVCgfW27I-ZnT6_2jWgHgFo&w=356&h=200&c=7&pid=1.7&rs=1">

                <div class="video-info">

                    <h3>Awarapan 2 teaser reaction</h3>

                    <p>ParbhmSingh</p>

                    <p>314K views 3 weeks ago</p>

                </div>

            </div>

            <div class="video-item" onclick="window.open('video.html?id=4','_blank')">

                <img
                    src="https://www.bing.com/th/id/OIP.ekRbvsNYAP69tyFNwkC_YgHaKt?w=193&h=280&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2">

                <div class="video-info">

                    <h3>Mr X</h3>

                    <p>Tollywood Box Office</p>

                    <p>1M views • 11 months ago</p>

                </div>

            </div>



        </div>

    </div>

</body>

</html>
