<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Liked Videos</title>

    <link rel="stylesheet" href="youtube_style.css">
    <link rel="icon" type="image/png"
        href="https://www.freepnglogos.com/uploads/youtube-logo-png/youtube-transparent-youtube-icon-download-clipart-with-transparent-25.png">

    <style>
        body {

            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #fff;

        }

        .liked-container {

            display: flex;
            padding: 25px;
            gap: 35px;

        }

        /* LEFT CARD */

        .playlist-card {

            width: 350px;
            background: linear-gradient(#8b5d3d, #5b3822);

            border-radius: 18px;
            padding: 25px;
            color: white;
            position: sticky;
            top: 90px;
            height: 730px;

        }

        .playlist-card img {

            width: 100%;
            border-radius: 15px;

        }

        .playlist-card h1 {

            margin-top: 20px;
            font-size: 42px;

        }

        .playlist-card h3 {

            font-size: 22px;
            margin-bottom: 10px;

        }

        .play-buttons {

            display: flex;
            gap: 15px;
            margin-top: 25px;

        }

        .play-buttons button {

            padding: 15px 30px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;

        }

        .play {

            background: white;

        }

        .shuffle {

            background: #6c4b34;
            color: white;

        }

        /* RIGHT */

        .right-area {

            flex: 1;

        }

        .filter {

            display: flex;
            gap: 10px;
            margin-bottom: 25px;

        }

        .filter button {

            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;

        }

        .filter .active {

            background: black;
            color: white;

        }

      /* =========================
   VIDEO ITEM
========================= */

.video-item {
    display: flex;
    margin-bottom: 22px;
    cursor: pointer;
    position: relative;
    width: 100%;
    min-height: 140px;
    padding: 0;
}

.video-item:hover {
    background: #f2f2f2;
}


/* =========================
   VIDEO THUMBNAIL
========================= */

.video-item > img {
    width: 250px !important;
    height: 140px !important;
    min-width: 250px;
    max-width: 250px;
    border-radius: 12px;
    object-fit: cover;
    display: block;
}


/* =========================
   VIDEO DURATION
========================= */
.video-item > .dur {
    position: absolute;

    /* Position at bottom-right of the 250px thumbnail */
    left: 194px;
    bottom: 6px;

    /* IMPORTANT: prevent the black background from stretching */
    width: auto !important;
    max-width: max-content !important;
    min-width: 0 !important;

    display: inline-block;

    background: rgba(0, 0, 0, 0.85);
    color: #fff;

    padding: 3px 6px;
    border-radius: 4px;

    font-size: 13px;
    font-weight: bold;
    line-height: 1.2;

    white-space: nowrap;

    box-sizing: border-box;
    z-index: 10;
}


/* =========================
   VIDEO INFORMATION
========================= */

.video-info {
    margin-left: 15px;
    padding-top: 0;
}

.video-info h3 {
    margin: 0;
    font-size: 22px;
}

.video-info p {
    margin: 8px 0;
    color: gray;
}
/* Thumbnail wrapper */


/* Video duration */
.dur {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0, 0, 0, 0.85);
    color: white;
    padding: 3px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.2;
}
    </style>

</head>

<body>

    <div class="liked-container">

        <div class="playlist-card">

            <img src="images/liked-banner.jpg">

            <h1>Liked Videos</h1>

            <h3>Raunak Rej</h3>

            <p>145 Videos</p>

            <div class="play-buttons">

                <button class="play">
                    ▶ Play All
                </button>

                <button class="shuffle">
                    🔀 Shuffle
                </button>

            </div>

        </div>

        <div class="right-area">

            <div class="filter">

                <button class="active">All</button>

                <button>Videos</button>

                <button>Shorts</button>

            </div>

            <div class="video-item" onclick="window.open('video.html?id=1','_blank')">

                <img
                    src="https://alchetron.com/cdn/footpath-2003-film-e6fce519-6290-411a-9f13-a3123a85251-resize-750.jpg">

</body>

</html>
